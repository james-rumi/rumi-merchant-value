<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Dashboard</title>
<style>
:root{ --color-fg:#111614; --color-fg-muted:#5d6862; --color-bg:#fff; --color-panel:#fff; --color-border-line:#e4e8e5; --color-ok:#006300; --color-warn:#734500; --color-bad:#8e2626;
 --font-anthropic-sans: -apple-system, "Helvetica Neue", "Segoe UI", system-ui, sans-serif; --cds-font-size-caption:12px; --cds-font-size-body:14px; --cds-font-size-heading:17px; --cds-font-size-title:28px; --cds-font-weight-medium:500;
 --cds-gap-xs:4px; --cds-gap-sm:8px; --cds-gap-md:16px; --cds-gap-lg:24px; --cds-gap-xl:36px; --cds-pad-lg:16px; --cds-radius:10px;
 --cds-chart-muted:#cdd3cf; --cds-chart-grid:#eef1ef; --cds-chart-axis:#c9cfcb; --cds-text-secondary:#5d6862; --cds-surface-popover:#fff; --cds-border:#e4e8e5; --cds-shadow-popover:0 4px 16px rgba(0,0,0,.08);
 --c0:#2F8A63; --c1:#C27F1C; }
html,body{margin:0;background:var(--color-bg);color:var(--color-fg);font-family:var(--font-anthropic-sans);font-size:14px}
#dash-root{padding:28px 32px 48px;max-width:1240px;margin:0 auto}
@media (max-width: 640px){ #dash-root{padding:20px 16px 40px} }
.site-msg{max-width:38ch;margin:22vh auto 0;padding:0 16px;text-align:center;color:var(--color-fg-muted);line-height:1.5}
.site-late{margin:0 0 20px;padding:10px 14px;border:1px solid var(--color-warn);border-radius:10px;font-size:13px;color:var(--color-warn);line-height:1.45}
.site-msg[hidden],.site-late[hidden]{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
</head><body>
<p class="site-msg" id="site-msg">Opening…</p>
<div id="dash-root" hidden><p class="site-late" id="site-late" hidden>These numbers are more than 3 hours old. The hourly refresh has not run since the time shown below.</p></div>
<script>
// Unlocks the page with the key at the end of the link (after #), then draws it.
// The key never leaves the reader's browser: browsers do not send the part after # to any server.
(async () => {
  const msg = document.getElementById('site-msg');
  const say = (text) => { msg.textContent = text; msg.hidden = false; };
  let box, nonce;
  try {
    const k = location.hash.replace(/^#/, '');
    if (!k) return say('This page opens only with its full link. Ask whoever sent it to you for the complete address.');
    const b64 = k.replace(/-/g, '+').replace(/_/g, '/');
    const raw = Uint8Array.from(atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4)), (c) => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const res = await fetch('data.bin?t=' + Math.floor(Date.now() / 300000), { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch ' + res.status);
    const buf = new Uint8Array(await res.arrayBuffer());
    nonce = Array.from(buf.slice(0, 12)).join(',');
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
    box = JSON.parse(new TextDecoder().decode(plain));
  } catch (e) {
    return say('This link is not complete or is no longer valid. Ask whoever sent it to you for the current address.');
  }
  document.title = box.title || 'Dashboard';
  window.__DATA = box.data;

  // A small stand-in for the dashboard's runtime: loads each table from the unlocked numbers, runs the page's calcs and drawings.
  const loaders = {}, calcs = {}, draws = {}, cache = {}, errors = [];
  window.dash = {
    colors: ['var(--c0)', 'var(--c1)'],
    loader: (id, o) => { loaders[id] = o; },
    calc: (id, o) => { calcs[id] = o; },
    data: (id) => {
      if (cache[id]) return cache[id];
      let out;
      try {
        if (loaders[id]) { const r = loaders[id].fn({ answer: window.__DATA }); out = { status: 'ok', data: r.data, columns: Object.keys(r.data[0] || {}) }; }
        else if (calcs[id]) { const c = calcs[id]; out = { status: 'ok', data: c.fn(...c.inputs.map((i) => dash.data(i).data)) }; }
        else out = { status: 'missing', data: [] };
      } catch (e) { errors.push(id + ': ' + e.message); out = { status: 'error', data: [], message: e.message }; }
      return (cache[id] = out);
    },
    onData: (fn) => fn(),
    draw: (name, fn) => { draws[name] = fn; },
    params: () => ({}), setParams: () => {}, resetParams: () => {}, setLink: () => {}, refresh: () => {},
  };
  const root = document.getElementById('dash-root');
  const tmp = document.createElement('div'); tmp.innerHTML = box.page;
  const scripts = [...tmp.querySelectorAll('script')].map((s) => { const c = s.textContent; s.remove(); return c; });
  root.append(...tmp.childNodes);
  msg.hidden = true; root.hidden = false;
  for (const code of scripts) { try { new Function(code)(); } catch (e) { errors.push('script: ' + e.message); } }
  // Like the dashboard itself: nothing under `hidden` is drawn, and a drawing inside another is never called.
  // (A page that relies on either would look right here and wrong in the dashboard.)
  const runDraws = () => { for (const [name, fn] of Object.entries(draws)) document.querySelectorAll('[data-draw="' + name + '"]').forEach((el) => {
    if (el.closest('[hidden]') || (el.parentElement && el.parentElement.closest('[data-draw]'))) return;
    try { fn(el); } catch (e) { errors.push('draw ' + name + ': ' + e.message); } }); };
  runDraws();
  let timer; window.addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(runDraws, 120); });
  window.__ERRORS = errors;

  // say so when the hourly refresh has stopped
  const made = Date.parse(box.generated);
  if (made && Date.now() - made > 3 * 3600 * 1000) document.getElementById('site-late').hidden = false;
  // an open page picks up new numbers within a few minutes: every new file starts with a new nonce
  setInterval(async () => {
    try {
      const head = await fetch('data.bin?t=' + Date.now(), { cache: 'no-store', headers: { Range: 'bytes=0-11' } });
      const first = new Uint8Array(await head.arrayBuffer()).slice(0, 12);
      if (first.length === 12 && Array.from(first).join(',') !== nonce) location.reload();
    } catch (e) { /* offline: try again next time */ }
  }, 3 * 60 * 1000);
})();
</script>
</body></html>
